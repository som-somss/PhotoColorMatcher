name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name PhotoColorMatcher photo_color_matcher.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: PhotoColorMatcher-Windows
          path: dist/PhotoColorMatcher.exe
          if-no-files-found: error
